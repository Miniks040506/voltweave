spring:
  application:
    name: telemetry-service
  datasource:
    url: ${TELEMETRY_DB_URL:jdbc:postgresql://localhost:6543/telemetry_db}
    username: ${TELEMETRY_DB_USERNAME:telemetry_app}
    password: ${TELEMETRY_DB_PASSWORD:local-telemetry-change-me}
  flyway:
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/voltweave}
      client:
        registration:
          voltweave-internal:
            provider: keycloak
            client-id: voltweave-internal
            client-secret: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:local-internal-change-me}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8180/realms/voltweave/protocol/openid-connect/token}

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Owns telemetry ingestion, history and digital twins

voltweave:
  ingress:
    enabled: ${TELEMETRY_INGRESS_ENABLED:true}
    broker-uri: ${MQTT_BROKER_URI:tcp://localhost:1883}
    username: ${MQTT_TELEMETRY_USERNAME:telemetry-service}
    password: ${MQTT_TELEMETRY_PASSWORD:local-telemetry-mqtt-change-me}
    topic: voltweave/+/+/+/telemetry
    ack-topic: voltweave/+/+/+/ack
  processing:
    enabled: ${TELEMETRY_PROCESSING_ENABLED:true}
    stale-after: ${TELEMETRY_STALE_AFTER:5m}
    out-of-order-window: ${TELEMETRY_OUT_OF_ORDER_WINDOW:2m}
    dedup-retention: ${TELEMETRY_DEDUP_RETENTION:7d}
    dedup-cleanup-delay: ${TELEMETRY_DEDUP_CLEANUP_DELAY:1h}
    outbox-poll-delay: ${TELEMETRY_OUTBOX_POLL_DELAY:1s}
  command:
    enabled: ${TELEMETRY_COMMAND_ENABLED:true}
    poll-delay: ${TELEMETRY_COMMAND_POLL_DELAY:1s}
  portfolio:
    base-url: ${PORTFOLIO_SERVICE_URL:http://localhost:8081}
  realtime:
    stream-timeout: ${TELEMETRY_STREAM_TIMEOUT:55s}
