spring:
  application:
    name: dispatch-service
  datasource:
    url: ${DISPATCH_DB_URL:jdbc:postgresql://localhost:6543/dispatch_db}
    username: ${DISPATCH_DB_USERNAME:dispatch_app}
    password: ${DISPATCH_DB_PASSWORD:local-dispatch-change-me}
  flyway:
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/voltweave}
      client:
        registration:
          voltweave-internal:
            provider: keycloak
            client-id: voltweave-internal
            client-secret: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:local-internal-change-me}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8180/realms/voltweave/protocol/openid-connect/token}

server:
  port: ${PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Owns durable dispatch workflows and frozen execution inputs

voltweave:
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    outbox-poll-delay: ${OUTBOX_POLL_DELAY:1s}
  command:
    acknowledgement-timeout: ${COMMAND_ACKNOWLEDGEMENT_TIMEOUT:30s}
    recovery-poll-delay: ${COMMAND_RECOVERY_POLL_DELAY:1s}
  performance:
    recovery-poll-delay: ${PERFORMANCE_RECOVERY_POLL_DELAY:1s}
  portfolio:
    base-url: ${PORTFOLIO_SERVICE_URL:http://localhost:8081}
  intelligence:
    base-url: ${INTELLIGENCE_SERVICE_URL:http://localhost:8083}
