spring:
  application:
    name: intelligence-service
  datasource:
    url: ${INTELLIGENCE_DB_URL:jdbc:postgresql://localhost:6543/intelligence_db}
    username: ${INTELLIGENCE_DB_USERNAME:intelligence_app}
    password: ${INTELLIGENCE_DB_PASSWORD:local-intelligence-change-me}
  flyway:
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/voltweave}
      client:
        registration:
          voltweave-internal:
            provider: keycloak
            client-id: voltweave-internal
            client-secret: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:local-internal-change-me}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8180/realms/voltweave/protocol/openid-connect/token}

server:
  port: ${PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: ${CONSOLE_LOG_FORMAT:ecs}

info:
  app:
    name: ${spring.application.name}
    description: Generates immutable energy forecasts and flexibility snapshots

voltweave:
  tariff:
    off-peak-price: ${TARIFF_OFF_PEAK_PRICE:0.10}
    peak-price: ${TARIFF_PEAK_PRICE:0.30}
    peak-start-hour-utc: ${TARIFF_PEAK_START_HOUR_UTC:17}
    peak-end-hour-utc: ${TARIFF_PEAK_END_HOUR_UTC:21}
  projection:
    enabled: ${INTELLIGENCE_PROJECTION_ENABLED:true}
  forecast:
    training-window: ${FORECAST_TRAINING_WINDOW:7d}
    freshness: ${FORECAST_FRESHNESS:30m}
  flexibility:
    freshness: ${FLEXIBILITY_TELEMETRY_FRESHNESS:5m}
    future-skew: ${FLEXIBILITY_TELEMETRY_FUTURE_SKEW:30s}
  portfolio:
    base-url: ${PORTFOLIO_SERVICE_URL:http://localhost:8081}
