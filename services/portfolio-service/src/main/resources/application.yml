spring:
  application:
    name: portfolio-service
  datasource:
    url: ${PORTFOLIO_DB_URL:jdbc:postgresql://localhost:6543/portfolio_db}
    username: ${PORTFOLIO_DB_USERNAME:portfolio_app}
    password: ${PORTFOLIO_DB_PASSWORD:local-portfolio-change-me}
  flyway:
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/voltweave}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Owns tenants, sites, devices and virtual power plants

voltweave:
  mqtt:
    broker-uri: ${MQTT_BROKER_URI:tcp://localhost:1883}
    admin-username: ${MQTT_ADMIN_USERNAME:voltweave-provisioner}
    admin-password: ${MQTT_ADMIN_PASSWORD:local-mqtt-admin-change-me}
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    outbox:
      poll-delay: ${OUTBOX_POLL_DELAY:1s}
