spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/voltweave}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: telemetry-public
              uri: ${TELEMETRY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/sites/*/telemetry,/api/v1/sites/*/live,/api/v1/devices/*/twin,/api/v1/stream/sites/*
            - id: intelligence-forecast
              uri: ${INTELLIGENCE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/vpps/*/forecast
            - id: intelligence-flexibility
              uri: ${INTELLIGENCE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/vpps/*/flexibility
            - id: intelligence-optimization
              uri: ${INTELLIGENCE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/vpps/*/optimization-preview
            - id: settlement-public
              uri: ${SETTLEMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/settlements/**,/api/v1/dispatches/*/settlements,/api/v1/customers/me/earnings,/api/v1/reports/dispatches/*.csv
            - id: dispatch-public
              uri: ${DISPATCH_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/dispatches,/api/v1/dispatches/**
            - id: portfolio-organizations
              uri: ${PORTFOLIO_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/organizations,/api/v1/organizations/**
            - id: portfolio-sites
              uri: ${PORTFOLIO_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/sites,/api/v1/sites/**
            - id: portfolio-devices
              uri: ${PORTFOLIO_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/devices,/api/v1/devices/**
            - id: portfolio-vpps
              uri: ${PORTFOLIO_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/vpps,/api/v1/vpps/**
            - id: portfolio-audit
              uri: ${PORTFOLIO_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/audit,/api/v1/audit/**

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: ${CONSOLE_LOG_FORMAT:ecs}
