name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw --batch-mode verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run build

  containers:
    name: Application images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build release images
        run: >-
          docker compose
          --env-file infrastructure/compose/.env.example
          -f infrastructure/compose/compose.yml
          --profile app build

  production-guards:
    name: Production guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1 git . --no-banner
      - name: Validate Compose model
        run: >-
          docker compose
          --env-file infrastructure/compose/.env.example
          -f infrastructure/compose/compose.yml config --quiet
      - name: Validate Prometheus configuration
        run: >-
          docker run --rm
          --entrypoint promtool
          -v "$PWD/infrastructure/compose/observability:/etc/prometheus:ro"
          prom/prometheus:v3.13.1
          check config /etc/prometheus/prometheus.yml
      - name: Validate Grafana dashboard JSON
        run: >-
          jq empty
          infrastructure/compose/observability/grafana/dashboards/voltweave-acceptance.json
