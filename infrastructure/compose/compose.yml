name: voltweave

services:
  postgres:
    image: timescale/timescaledb:2.29.0-pg18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      TIMESCALEDB_TELEMETRY: "off"
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: "2"
      TS_TUNE_MAX_CONNS: "${POSTGRES_MAX_CONNECTIONS:-100}"
      PORTFOLIO_DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD:?PORTFOLIO_DB_PASSWORD is required}
      TELEMETRY_DB_PASSWORD: ${TELEMETRY_DB_PASSWORD:?TELEMETRY_DB_PASSWORD is required}
      INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?INTELLIGENCE_DB_PASSWORD is required}
      DISPATCH_DB_PASSWORD: ${DISPATCH_DB_PASSWORD:?DISPATCH_DB_PASSWORD is required}
      SETTLEMENT_DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD:?SETTLEMENT_DB_PASSWORD is required}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-6543}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init/010-create-service-databases.sh:/docker-entrypoint-initdb.d/010-create-service-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KEYCLOAK_INTERNAL_CLIENT_SECRET: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:?KEYCLOAK_INTERNAL_CLIENT_SECRET is required}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:?DEMO_CUSTOMER_PASSWORD is required}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:?DEMO_OPERATOR_PASSWORD is required}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?DEMO_ADMIN_PASSWORD is required}
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - ./keycloak/voltweave-realm.json:/opt/keycloak/data/import/voltweave-realm.json:ro
      - ./keycloak/healthcheck.sh:/opt/keycloak/healthcheck.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: "/bin/bash /opt/keycloak/healthcheck.sh"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 1g
    stop_grace_period: 30s

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 1g
    stop_grace_period: 30s

  kafka-init:
    image: apache/kafka:4.3.1
    command: ["bash", "/opt/voltweave/init-topics.sh"]
    volumes:
      - ./kafka/init-topics.sh:/opt/voltweave/init-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    entrypoint: ["/bin/sh", "/opt/voltweave/entrypoint.sh"]
    environment:
      MOSQUITTO_ADMIN_USERNAME: ${MOSQUITTO_ADMIN_USERNAME:?MOSQUITTO_ADMIN_USERNAME is required}
      MOSQUITTO_ADMIN_PASSWORD: ${MOSQUITTO_ADMIN_PASSWORD:?MOSQUITTO_ADMIN_PASSWORD is required}
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/opt/voltweave/entrypoint.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_ctrl -h localhost -p 1883
          -u "$${MOSQUITTO_ADMIN_USERNAME}"
          -P "$${MOSQUITTO_ADMIN_PASSWORD}"
          dynsec listRoles 2>/dev/null | grep -q admin
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 256m
    stop_grace_period: 15s

  mosquitto-init:
    image: eclipse-mosquitto:2.0.22
    entrypoint: ["/bin/sh", "/opt/voltweave/init-telemetry-reader.sh"]
    environment:
      MQTT_HOST: mosquitto
      MOSQUITTO_ADMIN_USERNAME: ${MOSQUITTO_ADMIN_USERNAME:?MOSQUITTO_ADMIN_USERNAME is required}
      MOSQUITTO_ADMIN_PASSWORD: ${MOSQUITTO_ADMIN_PASSWORD:?MOSQUITTO_ADMIN_PASSWORD is required}
      MQTT_TELEMETRY_USERNAME: ${MQTT_TELEMETRY_USERNAME:?MQTT_TELEMETRY_USERNAME is required}
      MQTT_TELEMETRY_PASSWORD: ${MQTT_TELEMETRY_PASSWORD:?MQTT_TELEMETRY_PASSWORD is required}
    volumes:
      - ./mosquitto/init-telemetry-reader.sh:/opt/voltweave/init-telemetry-reader.sh:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  kafka_data:
  mosquitto_data:
