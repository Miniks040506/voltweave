name: voltweave

x-backend-service: &backend-service
  profiles: ["app"]
  restart: unless-stopped
  environment: &backend-environment
    PORT: 8080
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    OIDC_ISSUER_URI: http://localhost:${KEYCLOAK_HOST_PORT:-8180}/realms/voltweave
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/voltweave/protocol/openid-connect/certs
    OIDC_TOKEN_URI: http://keycloak:8080/realms/voltweave/protocol/openid-connect/token
    PORTFOLIO_SERVICE_URL: http://portfolio-service:8080
    TELEMETRY_SERVICE_URL: http://telemetry-service:8080
    INTELLIGENCE_SERVICE_URL: http://intelligence-service:8080
    DISPATCH_SERVICE_URL: http://dispatch-service:8080
    SETTLEMENT_SERVICE_URL: http://settlement-service:8080
    CONSOLE_LOG_FORMAT: ecs
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 20
    start_period: 30s
  mem_limit: 640m
  stop_grace_period: 30s

services:
  postgres:
    image: timescale/timescaledb:2.29.0-pg18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      TIMESCALEDB_TELEMETRY: "off"
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: "2"
      TS_TUNE_MAX_CONNS: "${POSTGRES_MAX_CONNECTIONS:-100}"
      PORTFOLIO_DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD:?PORTFOLIO_DB_PASSWORD is required}
      TELEMETRY_DB_PASSWORD: ${TELEMETRY_DB_PASSWORD:?TELEMETRY_DB_PASSWORD is required}
      INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?INTELLIGENCE_DB_PASSWORD is required}
      DISPATCH_DB_PASSWORD: ${DISPATCH_DB_PASSWORD:?DISPATCH_DB_PASSWORD is required}
      SETTLEMENT_DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD:?SETTLEMENT_DB_PASSWORD is required}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-6543}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init/010-create-service-databases.sh:/docker-entrypoint-initdb.d/010-create-service-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KEYCLOAK_INTERNAL_CLIENT_SECRET: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:?KEYCLOAK_INTERNAL_CLIENT_SECRET is required}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:?DEMO_CUSTOMER_PASSWORD is required}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:?DEMO_OPERATOR_PASSWORD is required}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?DEMO_ADMIN_PASSWORD is required}
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - ./keycloak/voltweave-realm.json:/opt/keycloak/data/import/voltweave-realm.json:ro
      - ./keycloak/healthcheck.sh:/opt/keycloak/healthcheck.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: "/bin/bash /opt/keycloak/healthcheck.sh"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 1g
    stop_grace_period: 30s

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 1g
    stop_grace_period: 30s

  kafka-init:
    image: apache/kafka:4.3.1
    command: ["bash", "/opt/voltweave/init-topics.sh"]
    volumes:
      - ./kafka/init-topics.sh:/opt/voltweave/init-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    entrypoint: ["/bin/sh", "/opt/voltweave/entrypoint.sh"]
    environment:
      MOSQUITTO_ADMIN_USERNAME: ${MOSQUITTO_ADMIN_USERNAME:?MOSQUITTO_ADMIN_USERNAME is required}
      MOSQUITTO_ADMIN_PASSWORD: ${MOSQUITTO_ADMIN_PASSWORD:?MOSQUITTO_ADMIN_PASSWORD is required}
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/opt/voltweave/entrypoint.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_ctrl -h localhost -p 1883
          -u "$${MOSQUITTO_ADMIN_USERNAME}"
          -P "$${MOSQUITTO_ADMIN_PASSWORD}"
          dynsec listRoles 2>/dev/null | grep -q admin
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 256m
    stop_grace_period: 15s

  mosquitto-init:
    image: eclipse-mosquitto:2.0.22
    entrypoint: ["/bin/sh", "/opt/voltweave/init-telemetry-reader.sh"]
    environment:
      MQTT_HOST: mosquitto
      MOSQUITTO_ADMIN_USERNAME: ${MOSQUITTO_ADMIN_USERNAME:?MOSQUITTO_ADMIN_USERNAME is required}
      MOSQUITTO_ADMIN_PASSWORD: ${MOSQUITTO_ADMIN_PASSWORD:?MOSQUITTO_ADMIN_PASSWORD is required}
      MQTT_TELEMETRY_USERNAME: ${MQTT_TELEMETRY_USERNAME:?MQTT_TELEMETRY_USERNAME is required}
      MQTT_TELEMETRY_PASSWORD: ${MQTT_TELEMETRY_PASSWORD:?MQTT_TELEMETRY_PASSWORD is required}
    volumes:
      - ./mosquitto/init-telemetry-reader.sh:/opt/voltweave/init-telemetry-reader.sh:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: "no"

  portfolio-service:
    <<: *backend-service
    image: voltweave/portfolio-service:${VOLTWEAVE_VERSION:-local}
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: portfolio-service
    environment:
      <<: *backend-environment
      PORTFOLIO_DB_URL: jdbc:postgresql://postgres:5432/portfolio_db
      PORTFOLIO_DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD:?PORTFOLIO_DB_PASSWORD is required}
      MQTT_BROKER_URI: tcp://mosquitto:1883
      MQTT_ADMIN_USERNAME: ${MOSQUITTO_ADMIN_USERNAME:?MOSQUITTO_ADMIN_USERNAME is required}
      MQTT_ADMIN_PASSWORD: ${MOSQUITTO_ADMIN_PASSWORD:?MOSQUITTO_ADMIN_PASSWORD is required}
    ports:
      - "127.0.0.1:${PORTFOLIO_HOST_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mosquitto-init:
        condition: service_completed_successfully

  telemetry-service:
    <<: *backend-service
    image: voltweave/telemetry-service:${VOLTWEAVE_VERSION:-local}
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: telemetry-service
    environment:
      <<: *backend-environment
      TELEMETRY_DB_URL: jdbc:postgresql://postgres:5432/telemetry_db
      TELEMETRY_DB_PASSWORD: ${TELEMETRY_DB_PASSWORD:?TELEMETRY_DB_PASSWORD is required}
      KEYCLOAK_INTERNAL_CLIENT_SECRET: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:?KEYCLOAK_INTERNAL_CLIENT_SECRET is required}
      MQTT_BROKER_URI: tcp://mosquitto:1883
      MQTT_TELEMETRY_USERNAME: ${MQTT_TELEMETRY_USERNAME:?MQTT_TELEMETRY_USERNAME is required}
      MQTT_TELEMETRY_PASSWORD: ${MQTT_TELEMETRY_PASSWORD:?MQTT_TELEMETRY_PASSWORD is required}
    ports:
      - "127.0.0.1:${TELEMETRY_HOST_PORT:-8082}:8080"
    depends_on:
      portfolio-service:
        condition: service_healthy

  intelligence-service:
    <<: *backend-service
    image: voltweave/intelligence-service:${VOLTWEAVE_VERSION:-local}
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: intelligence-service
    environment:
      <<: *backend-environment
      INTELLIGENCE_DB_URL: jdbc:postgresql://postgres:5432/intelligence_db
      INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?INTELLIGENCE_DB_PASSWORD is required}
      KEYCLOAK_INTERNAL_CLIENT_SECRET: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:?KEYCLOAK_INTERNAL_CLIENT_SECRET is required}
    ports:
      - "127.0.0.1:${INTELLIGENCE_HOST_PORT:-8083}:8080"
    depends_on:
      portfolio-service:
        condition: service_healthy

  dispatch-service:
    <<: *backend-service
    image: voltweave/dispatch-service:${VOLTWEAVE_VERSION:-local}
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: dispatch-service
    environment:
      <<: *backend-environment
      DISPATCH_DB_URL: jdbc:postgresql://postgres:5432/dispatch_db
      DISPATCH_DB_PASSWORD: ${DISPATCH_DB_PASSWORD:?DISPATCH_DB_PASSWORD is required}
      KEYCLOAK_INTERNAL_CLIENT_SECRET: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:?KEYCLOAK_INTERNAL_CLIENT_SECRET is required}
    ports:
      - "127.0.0.1:${DISPATCH_HOST_PORT:-8084}:8080"
    depends_on:
      portfolio-service:
        condition: service_healthy
      intelligence-service:
        condition: service_healthy

  settlement-service:
    <<: *backend-service
    image: voltweave/settlement-service:${VOLTWEAVE_VERSION:-local}
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: settlement-service
    environment:
      <<: *backend-environment
      SETTLEMENT_DB_URL: jdbc:postgresql://postgres:5432/settlement_db
      SETTLEMENT_DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD:?SETTLEMENT_DB_PASSWORD is required}
      KEYCLOAK_INTERNAL_CLIENT_SECRET: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:?KEYCLOAK_INTERNAL_CLIENT_SECRET is required}
    ports:
      - "127.0.0.1:${SETTLEMENT_HOST_PORT:-8085}:8080"
    depends_on:
      portfolio-service:
        condition: service_healthy
      dispatch-service:
        condition: service_healthy

  api-gateway:
    <<: *backend-service
    image: voltweave/api-gateway:${VOLTWEAVE_VERSION:-local}
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: api-gateway
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    mem_limit: 512m
    depends_on:
      portfolio-service:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
      intelligence-service:
        condition: service_healthy
      dispatch-service:
        condition: service_healthy
      settlement-service:
        condition: service_healthy

  web:
    profiles: ["app"]
    image: voltweave/web:${VOLTWEAVE_VERSION:-local}
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m
    stop_grace_period: 20s

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    stop_grace_period: 20s

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    mem_limit: 512m
    stop_grace_period: 20s

volumes:
  postgres_data:
  kafka_data:
  mosquitto_data:
  prometheus_data:
  grafana_data:
