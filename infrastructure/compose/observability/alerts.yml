groups:
  - name: voltweave-service-health
    rules:
      - alert: VoltWeaveServiceDown
        expr: up{job="voltweave-services"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "VoltWeave service {{ $labels.instance }} is unavailable"

      - alert: VoltWeaveHighApiErrorRate
        expr: |
          sum by (application) (
            rate(http_server_requests_seconds_count{status=~"5.."}[5m])
          )
          /
          clamp_min(sum by (application) (
            rate(http_server_requests_seconds_count[5m])
          ), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} HTTP 5xx rate is above 5%"

      - alert: VoltWeaveHighApiP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (application, le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          ) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} p95 latency is above 300 ms"
